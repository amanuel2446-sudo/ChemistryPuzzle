<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chemistry Puzzle Game</title>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <h1>🧪 Chemistry Puzzle</h1>
        <p id="questionNumber">Select a Level to Begin</p>
    </header>

    <div class="card">

        <!-- Level Selection -->
        <div id="levelSelect">

            <h2>Choose Exam Level</h2>

            <button class="level-btn" onclick="selectLevel('equilibrium')">
                🧪 Level 1 - Chemical Equilibrium
            </button>

            <button class="level-btn" onclick="selectLevel('kinetics')">
                ⚡ Level 2 - Chemical Kinetics
            </button>

            <button class="level-btn" onclick="selectLevel('electrochemistry')">
                🔋 Level 3 - Electrochemistry
            </button>
            <button class="level-btn" onclick

        </div>

        <!-- Game Area -->
        <div id="gameArea" style="display:none;">

            <div class="timer" id="timer">
                ⏱ 30:00
            </div>

            <h2 id="question">
                Press START to begin the exam.
            </h2>

            <div class="options">

                <button id="btnA" class="option"></button>

                <button id="btnB" class="option"></button>

                <button id="btnC" class="option"></button>

                <button id="btnD" class="option"></button>

            </div>

            <div class="controls">

                <button id="startBtn"
                        class="start"
                        onclick="startGame()">
                    ▶ START EXAM
                </button>

            </div>

            <div id="score" class="score">
                ⭐ Score: 0 |
                ❤️ Lives: 3 |
                📚 Level: 1
            </div>

        </div>

    </div>

</div>

<!-- Game Script -->
<script src="script.js"></script>

<!-- Telegram Web App -->
<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

// Telegram Theme
document.body.style.backgroundColor =
    tg.themeParams.bg_color || "#111";

// Telegram User
const user = tg.initDataUnsafe?.user;

if(user){
    console.log("Player:", user.first_name);
}

// Send score back to Telegram
function sendScore(score){
    tg.sendData(JSON.stringify({
        score: score
    }));
}
</script>

</body>
</html>
