<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chemistry Puzzle</title>

<!-- Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header class="header">

<h1>🧪 Chemistry Puzzle</h1>

<p id="questionNumber">

Select a Level to Begin

</p>

<div id="progress">

Question 0 / 0

</div>

</header>



<div class="card">

<!-- ========================= -->
<!-- LEVEL SELECTION -->
<!-- ========================= -->

<div id="levelSelect">

<h2>Choose Exam Level</h2>

<button class="level-btn"
onclick="selectLevel('equilibrium')">

🧪 Level 1 - Chemical Equilibrium

</button>


<button class="level-btn"
onclick="selectLevel('kinetics')">

⚡ Level 2 - Chemical Kinetics

</button>


<button class="level-btn"
onclick="selectLevel('electrochemistry')">

🔋 Level 3 - Electrochemistry

</button>


<button class="level-btn"
onclick="selectLevel('Oxygen containing organic compounds')">

🍀 Level 4 - Oxygen Containing Organic Compounds

</button>


<button class="level-btn"
onclick="selectLevel('Inorganic compounds')">

⚗️ Level 5 - Inorganic Compounds

</button>


<button class="level-btn"
onclick="selectLevel('Atomic theory and structure')">

🪐 Level 6 - Atomic Theory and Structure

</button>


<button class="level-btn"
onclick="selectLevel('Chemical bonds')">

👨‍🔬 Level 7 - Chemical Bonds

</button>


<button class="level-btn"
onclick="selectLevel('Hydrocarbons')">

🚀 Level 8 - Hydrocarbons

</button>


<button class="level-btn"
onclick="selectLevel('Physical state of matter')">

☁️ Level 9 - Physical State of Matter

</button>


<button class="level-btn"
onclick="selectLevel('Solutions')">

🧫 Level 10 - Solutions

</button>

</div>



<!-- ========================= -->
<!-- GAME AREA -->
<!-- ========================= -->

<div id="gameArea"
style="display:none;">

<div
class="timer"
id="timer">

⏱ 40:00

</div>


<div class="music-controls">

<button id="musicBtn">

🎵 Music ON

</button>

</div>


<h2 id="question">

Press START EXAM

</h2>


<div class="options">

<button
id="btnA"
class="option">

</button>


<button
id="btnB"
class="option">

</button>


<button
id="btnC"
class="option">

</button>


<button
id="btnD"
class="option">

</button>

</div>
